<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Municipality of Real — Quezon Province</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0F2419 0%, #1A3C2E 55%, #0F2419 100%);
    font-family: 'Inter', sans-serif;
    color: white;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .seal {
    width: 76px; height: 76px; margin: 0 auto 26px;
    background: #C9A227;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    box-shadow: 0 10px 30px rgba(201,162,39,0.35);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 1.9rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 14px;
  }
  .muni-name {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C9A227;
    font-weight: 600;
    margin-bottom: 10px;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.7);
    margin-bottom: 30px;
  }
  .divider {
    width: 40px; height: 2px; background: rgba(201,162,39,0.5);
    margin: 0 auto 30px;
  }
  .contact-label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
  }
  .contact-links {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  .contact-links a {
    display: inline-flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 500;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .contact-links a:hover {
    background: rgba(201,162,39,0.15);
    border-color: rgba(201,162,39,0.5);
    transform: translateY(-2px);
  }
  .contact-links svg { width: 18px; height: 18px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="seal">🏛️</div>
    <div class="muni-name">Municipality of Real — Quezon Province</div>
    <h1>This website is temporarily unavailable</h1>
    <p>We're currently making improvements behind the scenes. Please check back again soon — we appreciate your patience.</p>
    <div class="divider"></div>
    <div class="contact-label">Website Inquiries</div>
    <div class="contact-links">
      <a href="https://www.facebook.com/darwin.cantillo.73/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
        Message on Facebook
      </a>
      <a href="https://darwin-portfolio-livid.vercel.app/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        View Developer Portfolio
      </a>
    </div>
  </div>
</body>
</html>
